# ---- Light theme (default, warm "paper" look) ----
[theme]
base = "light"
primaryColor = "#C96442"
backgroundColor = "#FAF9F5"
secondaryBackgroundColor = "#F0EEE6"
textColor = "#1F1E1D"
font = "sans serif"

